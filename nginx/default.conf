server {
    listen 80;
    listen [::]:80;
    server_name vistaparadox.org www.vistaparadox.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vistaparadox.org www.vistaparadox.org;

    ssl_certificate /etc/letsencrypt/live/vistaparadox.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vistaparadox.org/privkey.pem;

    root /var/www/arg/nginx;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /index.css {
        try_files /index.css =404;
    }

    location = /index.js {
        try_files /index.js =404;
    }

    # API забирает серверное время для таймера
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование main БЕЗ слэша на конце proxy_pass (рвет петлю 307)
    location /main {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
