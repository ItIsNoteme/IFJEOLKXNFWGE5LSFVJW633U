server {
    listen 80;
    server_name _;

    root /var/www/arg/nginx;

    # The entry screen is static so nginx can show it before the app is opened.
    location = / {
        try_files /index.html =404;
    }

    location = /index.css {
        try_files /index.css =404;
    }

    location = /index.js {
        try_files /index.js =404;
    }

    location = /main {
        return 302 /main/;
    }

    location = /main/ {
        proxy_pass http://127.0.0.1:8000/main;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
