<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARG Startup</title>
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <main class="dos-window" aria-live="polite">
    <div class="dos-title">C:\\WINDOWS\\SYSTEM32\\ARG_STARTUP.EXE</div>
    <div class="dos-screen">
      <p>Microsoft(R) Windows XP [Version 5.1.2600]</p>
      <p>(C) Copyright 1985-2001 Microsoft Corp.</p>
      <p class="blank">&nbsp;</p>
      <p>Initializing ARG desktop...</p>
      <p>Loading main site in <strong id="countdown">--:--:--</strong><span class="cursor">_</span></p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <p id="status">Contacting server time...</p>
      <div class="actions">
        <button class="dos-button" id="restart" type="button">[ RESTART TIMER ]</button>
      </div>
    </div>
  </main>
  <script src="/index.js" defer></script>
</body>
</html>
